# Фрагмент для /home/deploy/agentvibe/docker/nginx/default.conf
# server block: game.multivibe.ru — добавить ПЕРЕД location = /favicon.ico

    # WebSocket для authoritative-сервера (server.js, порт 2567)
    # 172.18.0.1 = gateway docker-сети agentvibe_agentvibe (хост изнутри контейнера)
    location /ws {
        proxy_pass http://172.18.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Серверный код и боты наружу не отдаём
    location ~ ^/(server|bots)/ {
        deny all;
    }

# ПОДВОДНЫЙ КАМЕНЬ: после правки default.conf нужен `docker restart agentvibe-nginx`,
# НЕ `nginx -s reload`! Файл монтируется в контейнер как bind по inode; если редактор
# пересоздал файл (temp+rename), контейнер продолжает видеть старый inode.
# Проверка: docker exec agentvibe-nginx grep -c 'location /ws' /etc/nginx/conf.d/default.conf
