# Фрагмент для /home/deploy/agentvibe/docker/nginx/default.conf
# server block: game.multivibe.ru — добавить ПЕРЕД location = /favicon.ico

    # WebSocket для authoritative-сервера (server.js, порт 2567)
    location /ws {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Серверный код и боты не отдаём наружу
    location ~ ^/(server|bots)/ {
        deny all;
        return 404;
    }

# Проверка конфига: docker exec agentvibe-nginx nginx -t
# Применение: docker exec agentvibe-nginx nginx -s reload
